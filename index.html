<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Library</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #121a30;
      --card: #141f3a;
      --text: #e6ecff;
      --text-soft: #9aa7d1;
      --accent: #7c9bff;
      --border: #243256;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(circle at top, #1a2550 0%, var(--bg) 50%, #060a16 100%);
      color: var(--text);
    }

    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1rem 3rem;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0;
      letter-spacing: -0.02em;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
    }

    .subtitle {
      color: var(--text-soft);
      margin-top: 0.3rem;
      font-size: 0.95rem;
    }

    .status {
      border: 1px solid var(--border);
      background: rgba(20, 31, 58, 0.7);
      color: var(--text-soft);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)) , var(--card);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .preview {
      aspect-ratio: 16 / 9;
      width: 100%;
      object-fit: cover;
      background: #0f1831;
      border-bottom: 1px solid var(--border);
    }

    .preview.placeholder {
      display: grid;
      place-items: center;
      color: #88a0e6;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .meta {
      padding: 0.9rem;
    }

    .name {
      margin: 0;
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .type {
      margin: 0.4rem 0 0;
      color: var(--text-soft);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      color: var(--text-soft);
      background: rgba(20, 31, 58, 0.4);
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background: rgba(124, 155, 255, 0.15);
      border: 1px solid rgba(124, 155, 255, 0.3);
      border-radius: 6px;
      padding: 0.1rem 0.35rem;
      color: #c9d8ff;
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <header class="header">
      <div>
        <h1>My Content Library</h1>
        <p class="subtitle">Files are loaded from <code>/content/files.json</code>.</p>
      </div>
      <p class="status" id="status">Loading content…</p>
    </header>

    <section class="grid" id="grid"></section>
  </main>

  <script>
    const VIDEO_EXTENSIONS = new Set(["mp4", "webm", "mov", "mkv", "m4v", "avi"]);
    const IMAGE_EXTENSIONS = new Set(["jpg", "jpeg", "png", "gif", "webp", "avif"]);

    function getFileExtension(path) {
      const cleanPath = path.split("?")[0].split("#")[0];
      const idx = cleanPath.lastIndexOf(".");
      return idx >= 0 ? cleanPath.slice(idx + 1).toLowerCase() : "";
    }

    function getType(ext) {
      if (VIDEO_EXTENSIONS.has(ext)) return "video";
      if (IMAGE_EXTENSIONS.has(ext)) return "image";
      return "file";
    }

    function makePreview(path, type) {
      if (type === "video") {
        const video = document.createElement("video");
        video.className = "preview";
        video.src = path;
        video.muted = true;
        video.playsInline = true;
        video.preload = "metadata";
        return video;
      }

      if (type === "image") {
        const img = document.createElement("img");
        img.className = "preview";
        img.src = path;
        img.alt = "Preview";
        img.loading = "lazy";
        return img;
      }

      const placeholder = document.createElement("div");
      placeholder.className = "preview placeholder";
      placeholder.textContent = "Open file";
      return placeholder;
    }

    function renderFiles(fileEntries) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      if (!Array.isArray(fileEntries) || fileEntries.length === 0) {
        const empty = document.createElement("article");
        empty.className = "empty";
        empty.innerHTML = "No files found. Add files in <code>/content</code> and list them in <code>/content/files.json</code>.";
        grid.appendChild(empty);
        return;
      }

      fileEntries.forEach((entry) => {
        const relativePath = typeof entry === "string" ? entry : entry.path;
        if (!relativePath) return;

        const href = relativePath.startsWith("/") ? relativePath : `/content/${relativePath}`;
        const name = typeof entry === "string" ? relativePath.split("/").pop() : (entry.name || relativePath.split("/").pop());
        const ext = getFileExtension(href);
        const type = getType(ext);

        const card = document.createElement("a");
        card.className = "card";
        card.href = href;
        card.target = "_blank";
        card.rel = "noopener noreferrer";

        card.appendChild(makePreview(href, type));

        const meta = document.createElement("div");
        meta.className = "meta";

        const title = document.createElement("h2");
        title.className = "name";
        title.textContent = name;

        const typeTag = document.createElement("p");
        typeTag.className = "type";
        typeTag.textContent = type;

        meta.appendChild(title);
        meta.appendChild(typeTag);
        card.appendChild(meta);
        grid.appendChild(card);
      });
    }

    async function loadFiles() {
      const status = document.getElementById("status");
      try {
        const response = await fetch("./content/files.json", { cache: "no-cache" });
        if (!response.ok) throw new Error(`Failed with status ${response.status}`);

        const data = await response.json();
        renderFiles(data.files || data);
        const count = Array.isArray(data.files || data) ? (data.files || data).length : 0;
        status.textContent = `${count} file${count === 1 ? "" : "s"} loaded`;
      } catch (error) {
        status.textContent = "Could not load files.json";
        renderFiles([]);
        console.error(error);
      }
    }

    loadFiles();
  </script>
</body>
</html>

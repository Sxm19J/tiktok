<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Library</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #121a30;
      --card: #141f3a;
      --text: #e6ecff;
      --text-soft: #9aa7d1;
      --accent: #7c9bff;
      --border: #243256;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(circle at top, #1a2550 0%, var(--bg) 50%, #060a16 100%);
      color: var(--text);
    }

    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1rem 3rem;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0;
      letter-spacing: -0.02em;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
    }

    .subtitle {
      color: var(--text-soft);
      margin-top: 0.3rem;
      font-size: 0.95rem;
    }

    .status {
      border: 1px solid var(--border);
      background: rgba(20, 31, 58, 0.7);
      color: var(--text-soft);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)) , var(--card);
      box-shadow: var(--shadow);
      text-align: left;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .preview {
      aspect-ratio: 16 / 9;
      width: 100%;
      object-fit: cover;
      background: #0f1831;
      border-bottom: 1px solid var(--border);
    }

    .preview.placeholder {
      display: grid;
      place-items: center;
      color: #88a0e6;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .meta {
      padding: 0.9rem;
    }

    .name {
      margin: 0;
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .type {
      margin: 0.4rem 0 0;
      color: var(--text-soft);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      color: var(--text-soft);
      background: rgba(20, 31, 58, 0.4);
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(4, 8, 19, 0.86);
      padding: 1rem;
      z-index: 1000;
    }

    .viewer.open {
      display: flex;
    }

    .viewer-card {
      width: min(1000px, 100%);
      max-height: 92vh;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .viewer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--border);
    }

    .viewer-title {
      margin: 0;
      font-size: 0.95rem;
      overflow-wrap: anywhere;
      color: #d7e2ff;
    }

    .viewer-close {
      border: 1px solid var(--border);
      background: #182546;
      color: #d7e2ff;
      border-radius: 8px;
      padding: 0.4rem 0.7rem;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .viewer-body {
      padding: 0.75rem;
      overflow: auto;
      min-height: 280px;
      display: grid;
      place-items: center;
      background: #0a1329;
    }

    .viewer-body video,
    .viewer-body img,
    .viewer-body iframe {
      max-width: 100%;
      max-height: 78vh;
      border: 0;
      border-radius: 10px;
      background: #050b18;
    }

    .viewer-body a {
      color: #c2d3ff;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background: rgba(124, 155, 255, 0.15);
      border: 1px solid rgba(124, 155, 255, 0.3);
      border-radius: 6px;
      padding: 0.1rem 0.35rem;
      color: #c9d8ff;
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <header class="header">
      <div>
        <h1>My Content Library</h1>
        <p class="subtitle">Files are auto-loaded from GitHub <code>/content</code> (fallback: <code>/content/files.json</code>).</p>
      </div>
      <p class="status" id="status">Loading content…</p>
    </header>

    <section class="grid" id="grid"></section>
  </main>

  <section class="viewer" id="viewer" aria-hidden="true">
    <article class="viewer-card">
      <header class="viewer-head">
        <h2 class="viewer-title" id="viewerTitle"></h2>
        <button class="viewer-close" id="viewerClose" type="button">Close</button>
      </header>
      <div class="viewer-body" id="viewerBody"></div>
    </article>
  </section>

  <script>
    // Update these for your repository after you deploy.
    const REPO_CONFIG = {
      owner: "YOUR_GITHUB_USERNAME",
      repo: "YOUR_REPOSITORY_NAME",
      branch: "main",
      contentDir: "content"
    };

    const VIDEO_EXTENSIONS = new Set(["mp4", "webm", "mov", "mkv", "m4v", "avi"]);
    const IMAGE_EXTENSIONS = new Set(["jpg", "jpeg", "png", "gif", "webp", "avif"]);

    function getFileExtension(path) {
      const cleanPath = path.split("?")[0].split("#")[0];
      const idx = cleanPath.lastIndexOf(".");
      return idx >= 0 ? cleanPath.slice(idx + 1).toLowerCase() : "";
    }

    function getType(ext) {
      if (VIDEO_EXTENSIONS.has(ext)) return "video";
      if (IMAGE_EXTENSIONS.has(ext)) return "image";
      return "file";
    }

    function makePreview(path, type) {
      if (type === "video") {
        const video = document.createElement("video");
        video.className = "preview";
        video.src = path;
        video.muted = true;
        video.playsInline = true;
        video.preload = "metadata";
        return video;
      }

      if (type === "image") {
        const img = document.createElement("img");
        img.className = "preview";
        img.src = path;
        img.alt = "Preview";
        img.loading = "lazy";
        return img;
      }

      const placeholder = document.createElement("div");
      placeholder.className = "preview placeholder";
      placeholder.textContent = "Open file";
      return placeholder;
    }

    function openViewer(item) {
      const viewer = document.getElementById("viewer");
      const viewerTitle = document.getElementById("viewerTitle");
      const viewerBody = document.getElementById("viewerBody");
      viewerTitle.textContent = item.name;
      viewerBody.innerHTML = "";

      if (item.type === "video") {
        const video = document.createElement("video");
        video.src = item.url;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        viewerBody.appendChild(video);
      } else if (item.type === "image") {
        const img = document.createElement("img");
        img.src = item.url;
        img.alt = item.name;
        viewerBody.appendChild(img);
      } else {
        const wrapper = document.createElement("p");
        wrapper.innerHTML = `Preview is not available for this file type. <a href="${item.url}" target="_blank" rel="noopener noreferrer">Download / open in new tab</a>.`;
        viewerBody.appendChild(wrapper);
      }

      viewer.classList.add("open");
      viewer.setAttribute("aria-hidden", "false");
    }

    function closeViewer() {
      const viewer = document.getElementById("viewer");
      const viewerBody = document.getElementById("viewerBody");
      viewer.classList.remove("open");
      viewer.setAttribute("aria-hidden", "true");
      viewerBody.innerHTML = "";
    }

    function renderFiles(fileEntries) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      if (!Array.isArray(fileEntries) || fileEntries.length === 0) {
        const empty = document.createElement("article");
        empty.className = "empty";
        empty.innerHTML = "No files found in <code>/content</code>. Add files there and ensure GitHub repo settings are correct.";
        grid.appendChild(empty);
        return;
      }

      fileEntries.forEach((item) => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.setAttribute("aria-label", `Open ${item.name}`);

        card.appendChild(makePreview(item.url, item.type));

        const meta = document.createElement("div");
        meta.className = "meta";

        const title = document.createElement("h2");
        title.className = "name";
        title.textContent = item.name;

        const typeTag = document.createElement("p");
        typeTag.className = "type";
        typeTag.textContent = item.type;

        meta.appendChild(title);
        meta.appendChild(typeTag);
        card.appendChild(meta);

        card.addEventListener("click", () => openViewer(item));
        grid.appendChild(card);
      });
    }

    async function loadFromGithub() {
      const { owner, repo, branch, contentDir } = REPO_CONFIG;
      if (!owner || !repo || owner === "YOUR_GITHUB_USERNAME" || repo === "YOUR_REPOSITORY_NAME") {
        throw new Error("REPO_CONFIG is not set.");
      }

      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
      const response = await fetch(apiUrl, { cache: "no-cache" });
      if (!response.ok) throw new Error(`GitHub API failed: ${response.status}`);

      const data = await response.json();
      const prefix = `${contentDir}/`;
      const files = (data.tree || [])
        .filter((entry) => entry.type === "blob" && entry.path.startsWith(prefix))
        .map((entry) => {
          const ext = getFileExtension(entry.path);
          return {
            path: entry.path,
            name: entry.path.split("/").pop(),
            type: getType(ext),
            url: `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${entry.path}`
          };
        });

      return files;
    }

    async function loadFromManifest() {
      const response = await fetch("./content/files.json", { cache: "no-cache" });
      if (!response.ok) throw new Error(`Manifest failed: ${response.status}`);

      const data = await response.json();
      const fileEntries = data.files || data;
      return (Array.isArray(fileEntries) ? fileEntries : []).map((entry) => {
        const relativePath = typeof entry === "string" ? entry : entry.path;
        const name = typeof entry === "string" ? relativePath.split("/").pop() : (entry.name || relativePath.split("/").pop());
        const url = relativePath.startsWith("/") ? relativePath : `./content/${relativePath}`;
        const ext = getFileExtension(url);
        return {
          path: relativePath,
          name,
          type: getType(ext),
          url
        };
      });
    }

    async function loadFiles() {
      const status = document.getElementById("status");

      try {
        const files = await loadFromGithub();
        renderFiles(files);
        status.textContent = `${files.length} file${files.length === 1 ? "" : "s"} loaded from GitHub`;
      } catch (githubError) {
        try {
          const files = await loadFromManifest();
          renderFiles(files);
          status.textContent = `${files.length} file${files.length === 1 ? "" : "s"} loaded from local manifest`;
        } catch (manifestError) {
          status.textContent = "Could not load files";
          renderFiles([]);
          console.error(githubError);
          console.error(manifestError);
        }
      }
    }

    document.getElementById("viewerClose").addEventListener("click", closeViewer);
    document.getElementById("viewer").addEventListener("click", (event) => {
      if (event.target.id === "viewer") closeViewer();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeViewer();
    });

    loadFiles();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Library</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #121a30;
      --card: #141f3a;
      --text: #e6ecff;
      --text-soft: #9aa7d1;
      --accent: #7c9bff;
      --border: #243256;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(circle at top, #1a2550 0%, var(--bg) 50%, #060a16 100%);
      color: var(--text);
    }

    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1rem 3rem;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0;
      letter-spacing: -0.02em;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
    }

    .subtitle {
      color: var(--text-soft);
      margin-top: 0.3rem;
      font-size: 0.95rem;
    }

    .status {
      border: 1px solid var(--border);
      background: rgba(20, 31, 58, 0.7);
      color: var(--text-soft);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)), var(--card);
      box-shadow: var(--shadow);
      text-align: left;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
      padding: 0;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .preview {
      aspect-ratio: 16 / 9;
      width: 100%;
      object-fit: cover;
      background: #0f1831;
      border-bottom: 1px solid var(--border);
    }

    .preview.placeholder {
      display: grid;
      place-items: center;
      color: #88a0e6;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .meta { padding: 0.9rem; }

    .name {
      margin: 0;
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .type {
      margin: 0.4rem 0 0;
      color: var(--text-soft);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      color: var(--text-soft);
      background: rgba(20, 31, 58, 0.4);
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(4, 8, 19, 0.86);
      padding: 1rem;
      z-index: 1000;
    }

    .viewer.open { display: flex; }

    .viewer-card {
      width: min(1000px, 100%);
      max-height: 92vh;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .viewer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--border);
    }

    .viewer-title {
      margin: 0;
      font-size: 0.95rem;
      overflow-wrap: anywhere;
      color: #d7e2ff;
    }

    .viewer-close {
      border: 1px solid var(--border);
      background: #182546;
      color: #d7e2ff;
      border-radius: 8px;
      padding: 0.4rem 0.7rem;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .viewer-body {
      padding: 0.75rem;
      overflow: auto;
      min-height: 280px;
      display: grid;
      place-items: center;
      background: #0a1329;
      gap: 0.75rem;
    }

    .viewer-body video,
    .viewer-body img,
    .viewer-body iframe {
      width: 100%;
      max-width: 100%;
      max-height: 78vh;
      border: 0;
      border-radius: 10px;
      background: #050b18;
    }

    .viewer-body iframe { min-height: 70vh; }

    .viewer-body a { color: #c2d3ff; }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background: rgba(124, 155, 255, 0.15);
      border: 1px solid rgba(124, 155, 255, 0.3);
      border-radius: 6px;
      padding: 0.1rem 0.35rem;
      color: #c9d8ff;
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <header class="header">
      <div>
        <h1>My Content Library</h1>
        <p class="subtitle">Loads from <code>/content/files.json</code> and opens links in-page (including Gofile links).</p>
      </div>
      <p class="status" id="status">Loading content…</p>
    </header>

    <section class="grid" id="grid"></section>
  </main>

  <section class="viewer" id="viewer" aria-hidden="true">
    <article class="viewer-card">
      <header class="viewer-head">
        <h2 class="viewer-title" id="viewerTitle"></h2>
        <button class="viewer-close" id="viewerClose" type="button">Close</button>
      </header>
      <div class="viewer-body" id="viewerBody"></div>
    </article>
  </section>

  <script>
    const VIDEO_EXTENSIONS = new Set(["mp4", "webm", "mov", "mkv", "m4v", "avi"]);
    const IMAGE_EXTENSIONS = new Set(["jpg", "jpeg", "png", "gif", "webp", "avif"]);

    function getFileExtension(path) {
      const cleanPath = path.split("?")[0].split("#")[0];
      const idx = cleanPath.lastIndexOf(".");
      return idx >= 0 ? cleanPath.slice(idx + 1).toLowerCase() : "";
    }

    function isKnownEmbedHost(url) {
      return /(^|\.)gofile\.io$/i.test(new URL(url).hostname);
    }

    function getType(pathOrUrl) {
      const ext = getFileExtension(pathOrUrl);
      if (VIDEO_EXTENSIONS.has(ext)) return "video";
      if (IMAGE_EXTENSIONS.has(ext)) return "image";

      try {
        if (isKnownEmbedHost(pathOrUrl)) return "embed";
      } catch (_error) {
        // Ignore URL parse errors and fallback to generic file.
      }

      return "embed";
    }

    function createFileItem(name, url, explicitType) {
      return {
        path: name,
        name: name.split("/").pop(),
        type: explicitType || getType(url),
        url
      };
    }

    function makePreview(url, type) {
      if (type === "video") {
        const video = document.createElement("video");
        video.className = "preview";
        video.src = url;
        video.muted = true;
        video.playsInline = true;
        video.preload = "metadata";
        return video;
      }

      if (type === "image") {
        const img = document.createElement("img");
        img.className = "preview";
        img.src = url;
        img.alt = "Preview";
        img.loading = "lazy";
        return img;
      }

      const placeholder = document.createElement("div");
      placeholder.className = "preview placeholder";
      placeholder.textContent = "Embed link";
      return placeholder;
    }

    function openViewer(item) {
      const viewer = document.getElementById("viewer");
      const viewerTitle = document.getElementById("viewerTitle");
      const viewerBody = document.getElementById("viewerBody");
      viewerTitle.textContent = item.name;
      viewerBody.innerHTML = "";

      if (item.type === "video") {
        const video = document.createElement("video");
        video.src = item.url;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        viewerBody.appendChild(video);
      } else if (item.type === "image") {
        const img = document.createElement("img");
        img.src = item.url;
        img.alt = item.name;
        viewerBody.appendChild(img);
      } else {
        const iframe = document.createElement("iframe");
        iframe.src = item.url;
        iframe.loading = "eager";
        iframe.referrerPolicy = "no-referrer";
        iframe.allow = "fullscreen; autoplay";
        iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads");
        viewerBody.appendChild(iframe);

        const link = document.createElement("p");
        link.innerHTML = `If embed fails, <a href="${item.url}" target="_blank" rel="noopener noreferrer">open in new tab</a>.`;
        viewerBody.appendChild(link);
      }

      viewer.classList.add("open");
      viewer.setAttribute("aria-hidden", "false");
    }

    function closeViewer() {
      const viewer = document.getElementById("viewer");
      document.getElementById("viewerBody").innerHTML = "";
      viewer.classList.remove("open");
      viewer.setAttribute("aria-hidden", "true");
    }

    function renderFiles(fileEntries) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      if (!Array.isArray(fileEntries) || fileEntries.length === 0) {
        const empty = document.createElement("article");
        empty.className = "empty";
        empty.innerHTML = "No files found in <code>/content/files.json</code>. Add links and re-deploy.";
        grid.appendChild(empty);
        return;
      }

      fileEntries.forEach((item) => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.setAttribute("aria-label", `Open ${item.name}`);
        card.appendChild(makePreview(item.url, item.type));

        const meta = document.createElement("div");
        meta.className = "meta";
        const title = document.createElement("h2");
        title.className = "name";
        title.textContent = item.name;
        const typeTag = document.createElement("p");
        typeTag.className = "type";
        typeTag.textContent = item.type;
        meta.appendChild(title);
        meta.appendChild(typeTag);

        card.appendChild(meta);
        card.addEventListener("click", () => openViewer(item));
        grid.appendChild(card);
      });
    }

    async function loadFromManifest() {
      const response = await fetch("./content/files.json", { cache: "no-cache" });
      if (!response.ok) throw new Error(`Manifest failed: ${response.status}`);

      const data = await response.json();
      const fileEntries = data.files || data;
      const files = (Array.isArray(fileEntries) ? fileEntries : [])
        .map((entry) => {
          if (typeof entry === "string") {
            return createFileItem(entry, entry);
          }

          if (!entry || typeof entry !== "object") return null;

          const url = entry.url || entry.link || entry.path;
          if (!url) return null;

          const displayName = entry.name || url;
          const normalizedType = typeof entry.type === "string" ? entry.type.toLowerCase() : "";
          const explicitType = ["video", "image", "file", "embed"].includes(normalizedType) ? normalizedType : undefined;

          return createFileItem(displayName, url, explicitType);
        })
        .filter(Boolean);

      if (!files.length) throw new Error("No files in manifest");
      return files;
    }

    async function loadFiles() {
      const status = document.getElementById("status");
      try {
        const files = await loadFromManifest();
        renderFiles(files);
        status.textContent = `${files.length} file${files.length === 1 ? "" : "s"} loaded from files.json`;
      } catch (error) {
        console.debug("Load from files.json failed", error);
        status.textContent = "Could not load files.json";
        renderFiles([]);
      }
    }

    document.getElementById("viewerClose").addEventListener("click", closeViewer);
    document.getElementById("viewer").addEventListener("click", (event) => {
      if (event.target.id === "viewer") closeViewer();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeViewer();
    });

    loadFiles();
  </script>
</body>
</html>
